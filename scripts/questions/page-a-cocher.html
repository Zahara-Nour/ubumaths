								.replace(

									(_, l) => `<mi mathvariant="normal">${AJOUREES[l]}</mi>`
								)
						: ''
				)
				.join('<span class="case">?</span>');
		} catch {
			return mathsKatexEntiere(t, bloc);
		}
	}
	/* Case DANS une sous-formule (\dfrac{\placeholder}{4}) : la coupe laisse des accolades orphelines ;
	   formule rendue d'un tenant, la case devient un repère texte remplacé par une case MathML */
	function mathsKatexEntiere(t, bloc) {
		try {
			return katex
				.renderToString(t.replace(/\\placeholder\[\d+\]\{\}/g, '\\text{¤}'), {
					output: 'mathml',
					displayMode: bloc,
					throwOnError: true,
					macros: { ...MACROS }
				})
				.replace(/<mtext>¤<\/mtext>/g, '<mtext class="case-m">?</mtext>')
				.replace(
					/<mi mathvariant="double-struck">([CNQRZ])<\/mi>/g,
					(_, l) => `<mi mathvariant="normal">${AJOUREES[l]}</mi>`
				);
		} catch {
			return null;
		}
	}
	/* Les maths du CP sont des nombres et des signes : rendu texte, cases dessinées, signes typographiques */
	function maths(t, bloc = false) {
		if (/[\\^_{}]/.test(t.replace(/\^\{\\text\{[^}]*\}\}/g, '').replace(TEXTE_SEUL, ''))) {
			const rendu = mathsKatex(t, bloc);
			if (rendu) return rendu;
		}
		return esc(t)
			.replace(/\\placeholder\[\d+\]\{\}/g, '<span class="case">?</span>')
			.replace(/\{,\}/g, ',')
			.replace(/\\,/g, '\u202f')
			.replace(/\\ /g, ' ')
			.replace(/\\rightarrow/g, '→')
			.replace(/\\leftarrow/g, '←')
			.replace(/\\uparrow/g, '↑')
			.replace(/\\downarrow/g, '↓')
			.replace(/\\ldots/g, ' … ')
			.replace(/\\quad/g, ' ')
			.replace(/ - /g, ' − ')
			.replace(/^-$/, '−')
			.replace(/\^\{\\text\{([^}]*)\}\}/g, '<sup>$1</sup>')
			.replace(/~?\\unit\{([^}]*)\}/g, '\u00a0$1')
			.replace(/~/g, '\u00a0')
			.replace(/=/g, ' = ')
			.replace(/ {2,}/g, ' ')
			.trim();
	}
	function enLigne(t) {
		return t
			.split(/\$([^$]*)\$/)
			.map((m, i) =>
				i % 2
					? maths(m)
					: esc(m)
							.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
							.replace(/(^|[\s(])_([^_]+)_(?=$|[\s.,;:!?)])/g, '$1<em>$2</em>')
			)
			.join('');
	}
	function tableau(par) {
		const lignes = par
			.split('\n')
			.filter((l, i) => i !== 1)
			.map((l) =>
				l
					.replace(/^\||\|$/g, '')
					.split('|')
					.map((c) => c.trim())
			);
		const [tete, ...corps] = lignes;
		return `<div class="tab-wrap"><table class="tab"><thead><tr>${tete.map((c) => `<th>${enLigne(c)}</th>`).join('')}</tr></thead><tbody>${corps.map((r) => `<tr>${r.map((c, i) => (i === 0 ? `<th>${enLigne(c)}</th>` : `<td>${enLigne(c)}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>`;
	}
	function morceau(par) {
		if (par.startsWith('|')) return tableau(par);
		if (/^[●▲■★○△□ ]+$/.test(par)) return `<div class="formes">${esc(par)}</div>`;
		if (par.startsWith('@@HTML@@')) return `<div class="bloc">${par.slice(8)}</div>`;
		if (par.startsWith('$$')) return `<div class="calc">${maths(par.slice(2, -2), true)}</div>`;
		return `<div>${enLigne(par)}</div>`;
	}
	function rendu(t) {
		return t
			.split('\n\n')
			.flatMap((p) => p.split(/\n(?=@@HTML@@)/))
			.map(morceau)
			.join('');
	}
	function etape(s) {
		return s
			.split(/(\$\$[\s\S]*?\$\$)/)
			.map((p) => (p.startsWith('$$') ? morceau(p) : enLigne(p)))
			.join('');
	}

	function compter() {
		const ok = MODELES.filter((m) => verdicts[m.id]?.etat === 'ok').length;
		const revoir = MODELES.filter((m) => verdicts[m.id]?.etat === 'revoir').length;
		document.getElementById('compte').textContent =
			`${ok} OK · ${revoir} à revoir · ${MODELES.length - ok - revoir} sans verdict, sur ${MODELES.length}`;
	}

	function exemple(e) {
		const reponse = e.choices
			? `<ul class="choix${e.choices.some((c) => c.content.startsWith('@@HTML@@')) ? ' dessins' : ''}">${e.choices.map((c) => `<li class="${c.bon ? 'bon' : ''}">${c.bon ? '✔ ' : ''}${c.content.startsWith('@@HTML@@') ? c.content.slice(8) : enLigne(c.content)}</li>`).join('')}</ul>`
			: `<div class="attendu">Attendu, case par case : <b>${e.answer.split(' | ').map(maths).join(' | ')}</b></div>${e.solution ? `<div class="sol"><div class="attendu">Une construction juste, le moins d'objets (celle que montre la correction) :</div><div class="m-bloc">${e.solution}</div></div>` : ''}`;
		return `<div class="ex"><div class="var">variation ${e.variation}</div><div class="enonce">${rendu(e.statement)}</div>${reponse}<ol class="corrige">${e.steps.map((s) => `<li>${s.includes('@@HTML@@') ? rendu(s) : etape(s)}</li>`).join('')}</ol></div>`;
	}

	function fiche(m) {
		const v = verdicts[m.id] ?? {};
		return `<article class="fiche" data-id="${esc(m.id)}" data-etat="${v.etat ?? ''}">
		<div class="tete"><h2>${esc(m.titre)}</h2><span class="code">${esc(m.code)}</span><span class="niv">niveau ${m.niveau}</span><span class="niv">${esc({ draft: 'brouillon', published: 'publié', archived: 'archivé' }[m.statut] ?? m.statut)}</span><span class="meta">${esc(m.rangement)} · ${esc(m.id)}</span></div>
		${m.alertes.length ? `<p class="alerte">⚠ ${esc(m.alertes.join(' · '))}</p>` : ''}
        <p class="point"><b>${enLigne(m.libelle)}</b> ${m.bornes.length ? `Borne : ${enLigne(m.bornes.join(' ; '))}` : 'Aucune borne relevée.'}</p>
		<div class="exemples">${m.exemples.map(exemple).join('')}</div>
		<details><summary>Plages tirées et specs (${m.specs.length})</summary><ul>${[...m.variables, ...m.conditions.map((c) => 'condition ' + c)].map((x) => `<li><code>${esc(x)}</code></li>`).join('')}</ul><ul>${m.specs.map((s) => `<li>${enLigne(s)}</li>`).join('')}</ul></details>
		<div class="verdict">
			<button class="ok" data-v="ok" aria-pressed="${v.etat === 'ok'}">OK</button>
			<button class="revoir" data-v="revoir" aria-pressed="${v.etat === 'revoir'}">À revoir</button>
			<span class="etat-ecriture" id="etat-${esc(m.id)}"></span>
		</div>
		<textarea id="com-${esc(m.id)}" placeholder="Commentaire (facultatif pour OK)">${esc(v.commentaire ?? '')}</textarea>
	</article>`;
	}

	function afficher() {
		compter();
		const liste = MODELES.filter((m) => filtre === 'tout' || verdicts[m.id]?.etat !== 'ok');
		const zone = document.getElementById('fiches');
		zone.innerHTML = liste.length
			? liste.map(fiche).join('')
			: '<p class="vide">Tout est OK — rien ne reste à relire.</p>';
	}

	function bandeau() {
		const b = document.getElementById('bandeau');
		if (!db) {
			b.hidden = false;
			b.className = 'bandeau erreur';
			b.textContent =
				'Base indisponible : ouvre la page connecté à claude.ai pour enregistrer tes verdicts.';
			return;
		}
		if (file.length) {
			b.hidden = false;
			b.className = 'bandeau';
			b.textContent = `${file.length} réponse(s) en attente d'enregistrement — nouvel essai automatique.`;
			return;
		}
		b.hidden = true;
	}

	async function vider() {
		if (enCours || !db) return;
		enCours = true;
		while (file.length) {
			const { id, data } = file[0];
			const etat = document.getElementById('etat-' + id);
			try {
				await db.doc('verdicts/' + id).set(data);
				file.shift();
				delai = 2000;
				if (etat) etat.textContent = 'Enregistré';
				await new Promise((r) => setTimeout(r, 400));
			} catch (e) {
				if (etat) etat.textContent = 'Pas encore enregistré…';
				bandeau();
				await new Promise((r) => setTimeout(r, delai));
				delai = Math.min(delai * 2, 30000);
			}
			bandeau();
		}
		enCours = false;
		bandeau();
	}

	function enregistrer(id, patch) {
		const data = { ...(verdicts[id] ?? {}), ...patch, le: new Date().toISOString() };
		verdicts[id] = data;
		/* une seule entrée par fiche dans la file, sauf celle en cours d'envoi */
		const i = file.findIndex((x) => x.id === id);
		if (i > 0 || (i === 0 && !enCours)) file[i] = { id, data };
		else file.push({ id, data });
		bandeau();
		vider();
	}

	document.getElementById('fiches').addEventListener('click', (ev) => {
		const btn = ev.target.closest('button[data-v]');
		if (!btn) return;
		const art = btn.closest('.fiche');
		const id = art.dataset.id;
		const commentaire = document.getElementById('com-' + id).value;
		enregistrer(id, { etat: btn.dataset.v, commentaire });
		art.dataset.etat = btn.dataset.v;
		art
			.querySelectorAll('button[data-v]')
			.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
		compter();
	});
	document.getElementById('fiches').addEventListener('change', (ev) => {
		if (ev.target.tagName !== 'TEXTAREA') return;
		const id = ev.target.id.slice(4);
		enregistrer(id, { commentaire: ev.target.value });
	});
	for (const [bouton, valeur] of [
		['f-reste', 'reste'],
		['f-tout', 'tout']
	]) {
		document.getElementById(bouton).addEventListener('click', () => {
			filtre = valeur;
			document.getElementById('f-reste').setAttribute('aria-pressed', String(valeur === 'reste'));
			document.getElementById('f-tout').setAttribute('aria-pressed', String(valeur === 'tout'));
			afficher();
		});
	}

	afficher();
	(async () => {
		try {
			db = (await window.claude?.use?.('db')) ?? null;
		} catch (e) {
			db = null;
		}
		bandeau();
		if (!db) return;
		db.collection('verdicts').onSnapshot(
			(snap) => {
				const recu = {};
				snap.docs.forEach((d) => {
					recu[d.id] = d.data();
				});
				/* une réponse en attente l'emporte sur la base */
				for (const { id, data } of file) recu[id] = data;
				verdicts = recu;
				const focus = document.activeElement?.tagName === 'TEXTAREA';
				if (!focus) afficher();
				else compter();
			},
			() => bandeau()
		);
	})();
</script>
