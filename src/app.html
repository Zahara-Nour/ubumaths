<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Icônes. Sans ces déclarations, les navigateurs demandent /favicon.ico et
		     /apple-touch-icon.png par convention, et récoltaient un 404 à chaque
		     visite — c'était l'essentiel du bruit du monitoring de production. -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Performance Optimizations (2025-10-18) -->
		<!-- Preconnect to Supabase for faster auth/API requests -->
		<!-- SECURITY (finding L6): removed a stale preconnect/dns-prefetch to
		     umamathsprod.supabase.co — a host this project does not control (neither the
		     current EU project nor the previous one), leaking a DNS/TLS handshake per visit. -->

		<!-- Mathlive fonts - switchable between KaTeX and Shantell -->
		<link id="mathlive-fonts-css" rel="stylesheet" href="/mathlive-fonts-katex.css" />
		<!-- Mathlive static rendering styles (ML__* classes) — needed by convertLatexToMarkup()
		     output used in GeometryCanvas for flicker-free math text during drag operations -->
		<link rel="stylesheet" href="/mathlive-static.css" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
