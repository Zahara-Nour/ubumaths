<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Performance Optimizations (2025-10-18) -->
		<!-- Preconnect to Supabase for faster auth/API requests -->
		<link rel="preconnect" href="https://umamathsprod.supabase.co" crossorigin />
		<link rel="dns-prefetch" href="https://umamathsprod.supabase.co" />

		<!-- Mathlive fonts - loaded on demand via CSS to avoid preload warnings -->
		<link rel="stylesheet" href="/mathlive-fonts.css" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
