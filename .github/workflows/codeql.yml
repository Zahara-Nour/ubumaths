name: CodeQL

# Static security analysis (free for public repos). Scans JS/TS for vulnerabilities
# on push to main, on PRs, and weekly to catch newly-published CodeQL queries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 'security-extended' = the security queries plus lower-severity / lower-
          # precision security ones, WITHOUT the maintainability/quality queries.
          # Those quality queries (unused-var, semicolon-insertion, trivial-conditional…)
          # duplicate what prettier + eslint already enforce and only drown the security
          # findings in ~100+ style alerts, so we drop them here.
          queries: security-extended

      # No build step needed for JS/TS — CodeQL analyzes source directly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
