name: CodeQL

# Static security analysis (free for public repos). Scans JS/TS for vulnerabilities
# on push to main and weekly, to catch newly-published CodeQL queries.
#
# PAS sur `pull_request`, délibérément. Ce job dure ~6 min 25 et n'a jamais été
# un check REQUIS (cf. la protection de branche) — mais tant qu'il tourne, l'état
# de la PR reste `UNSTABLE` et **l'auto-merge de GitHub ne déclenche pas**. Il
# ajoutait donc son temps complet à chaque PR sans jamais rien bloquer.
#
# Ce qu'on garde : `push: main` analyse CHAQUE merge, donc rien n'atteint la
# production sans être passé par CodeQL. Le cron du lundi rattrape les requêtes
# nouvellement publiées sur du code déjà mergé.
#
# Ce qu'on perd : une alerte arrive après le merge et non avant. Sur un dépôt à
# un seul développeur, où le job n'était de toute façon pas bloquant, c'est
# quelques minutes de décalage — pas une régression de couverture.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 'security-extended' = the security queries plus lower-severity / lower-
          # precision security ones, WITHOUT the maintainability/quality queries.
          # Those quality queries (unused-var, semicolon-insertion, trivial-conditional…)
          # duplicate what prettier + eslint already enforce and only drown the security
          # findings in ~100+ style alerts, so we drop them here.
          queries: security-extended

      # No build step needed for JS/TS — CodeQL analyzes source directly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
