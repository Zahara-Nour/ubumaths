name: Core Web Vitals

# Le 2026-10-11, le FCP p75 de l'accueil était de 3,4 s pour un TTFB de 0,5 s
# (94 chunks JS préchargés volaient la bande passante aux CSS, corrigé par
# #1073). Personne ne l'avait vu : il fallait aller le chercher.
#
# Ce job relève chaque mois les mesures RÉELLES des visiteurs (nos mesures, table
# web_vital_samples, 28 jours, 75ᵉ centile), les classe selon les seuils de
# Google et publie le rapport dans une issue. Il ne diagnostique rien : une page
# au rouge se diagnostique à la main (docs/pratiques/core-web-vitals.md).
#
# Il ne lit pas la base : il appelle GET /api/web-vitals/releve, qui ne rend que
# des résultats calculés (p75 et nombre de mesures par page).
#
# Secret requis : WEB_VITALS_RELEVE_TOKEN, le même que la variable d'environnement
# du même nom sur Vercel (production). Il n'ouvre que cette route.

on:
  schedule:
    - cron: '0 6 1 * *' # le 1er du mois, 06:00 UTC
  workflow_dispatch: # déclenchement manuel

permissions:
  contents: read
  issues: write # pour publier le relevé

jobs:
  releve:
    name: Relevé mensuel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Relevé de nos mesures
        env:
          WEB_VITALS_RELEVE_TOKEN: ${{ secrets.WEB_VITALS_RELEVE_TOKEN }}
        run: npx tsx scripts/releve-web-vitals.ts 28 > releve.md

      # Une issue par mois ; la précédente est refermée en pointant vers la
      # nouvelle, pour qu'un seul relevé reste ouvert.
      - name: Publier le relevé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOIS=$(date -u +%Y-%m)
          TITRE="Core Web Vitals — relevé $MOIS"
          PRECEDENTS=$(gh issue list --state open --search "Core Web Vitals — relevé in:title" --json number --jq '.[].number')
          URL=$(gh issue create --title "$TITRE" --body-file releve.md)
          for N in $PRECEDENTS; do
            gh issue close "$N" --comment "Remplacé par le relevé suivant : $URL"
          done
          cat releve.md >> "$GITHUB_STEP_SUMMARY"
