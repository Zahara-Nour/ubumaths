name: Release

# When standard-version pushes a vX.Y.Z tag, publish a GitHub Release whose notes
# are the matching section extracted from CHANGELOG.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Extracting notes for $version"
          # Grab everything from this version's header to the next version header.
          awk -v ver="$version" '
            $0 ~ "^#+ \\[?" ver "[]) ]" { capture=1; next }
            capture && /^#+ \[?[0-9]+\.[0-9]+\.[0-9]+/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for $version — falling back to auto notes."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.fallback == 'false' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
