name: Nightly Integration Tests

# Integration tests (tests/integration/**, including tests/integration/database/
# trigger & RLS tests) need a real local Supabase stack. This spins up Supabase
# via the CLI, applies migrations, runs `pnpm test:integration`, tears it down.
#
# CRON DÉSACTIVÉ : `supabase start` échoue actuellement car l'image amont
# storage-api:fix-object-level (défaut CLI 2.105, avant que la CLI devienne une
# devDependency) n'est publiée sur aucun registre
# ("manifest unknown"). Tant que ce n'est pas résolu (cf. docs/wip/
# test-architecture-progress.md), on garde uniquement le déclenchement manuel
# pour éviter un job rouge toutes les nuits. Réactiver le cron une fois corrigé.

on:
  workflow_dispatch: # manual trigger only (cron disabled — see comment above)

jobs:
  integration:
    name: Integration tests (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        # Needed so svelte-kit sync can generate $env/static members.
        run: cp .github/ci.env .env

      - name: Supabase CLI version
        # Doit afficher la version exacte de la devDependency (package.json).
        run: pnpm exec supabase --version

      - name: Start Supabase (applies migrations)
        # Stack allégée : on exclut les services non requis (studio, edge, analytics,
        # mail, imgproxy). storage-api est GARDÉ : deux suites l'appellent
        # (chapter-documents-size-limit, chat-attachment-signing). Son image était
        # introuvable avec la CLI 2.105 ; la 2.118 utilise storage-api:v1.77.0.
        # CLI Supabase = la devDependency du projet (version exacte dans
        # package.json), la même que sur les postes : une seule source de vérité.
        run: pnpm exec supabase start -x imgproxy,studio,edge-runtime,logflare,vector,mailpit,postgres-meta

      - name: Export local Supabase credentials
        # The test helpers read SUPABASE_TEST_* (with localhost defaults); export the
        # actual local stack keys so they match the CLI version that just started.
        # La CLI écrit `NOM="valeur"` ; $GITHUB_ENV garde les guillemets tels quels,
        # et supabase-js refuse alors l'URL (« Invalid supabaseUrl »). On les retire,
        # et on échoue ICI si l'URL manque, plutôt que 119 fichiers de tests plus loin.
        run: |
          set -o pipefail
          pnpm exec supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z0-9_]+)="(.*)"$/\1=\2/' > supabase-test.env
          grep -q '^SUPABASE_TEST_URL=http' supabase-test.env
          cat supabase-test.env >> "$GITHUB_ENV"
          # Le code applicatif appelé par certaines suites (adminElevation, endpoint
          # skill-attempts) lit $env : sans ça, il garde les adresses bidon de
          # .github/ci.env (placeholder.supabase.co). Les variables du processus
          # priment sur le .env pour Vite.
          . ./supabase-test.env
          {
            echo "PUBLIC_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop
