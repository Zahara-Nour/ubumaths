name: Nightly Integration Tests

# Integration tests (tests/integration/**, including tests/integration/database/
# trigger & RLS tests) need a real local Supabase stack. This spins up Supabase
# via the CLI, applies migrations, runs `pnpm test:integration`, tears it down.
#
# DÉCLENCHEURS (réactivés le 2026-09-29, après le premier run vert, PR #512) :
#   - chaque nuit (cron, en UTC) ;
#   - sur les PR qui touchent un fichier pouvant changer le résultat de la suite
#     (filtre `paths` ci-dessous) ;
#   - à la main (workflow_dispatch).
#
# ⚠️ Ce workflow ne doit PAS être un check obligatoire de la protection de
# `main` : filtré par `paths`, il ne tourne pas sur les autres PR, qui
# attendraient pour toujours un check qui ne vient jamais. Le cron nocturne est
# le filet pour ce que le filtre laisserait passer.

on:
  schedule:
    # 02:17 UTC = 04:17 à Paris en heure d'été, 03:17 en heure d'hiver. Minute
    # non ronde : GitHub retarde souvent les tâches planifiées à l'heure pile.
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    # Filtre établi le 2026-09-29 en calculant la fermeture transitive des
    # imports de la suite (tests/integration/**/*.test.ts + global-setup.ts).
    # Dossier entier (/**) quand la suite en atteint une bonne part, ou pour ne
    # pas rater un nouveau voisin importé ; fichiers explicites quand l'atteinte
    # est ponctuelle dans un grand dossier. Le job `paths-filter` recalcule ce
    # périmètre à chaque run et échoue si le filtre ne le suit plus
    # (`pnpm check:integration-paths` fait foi).
    paths:
      # la base, les tests et leur outillage
      - 'supabase/**'
      - 'tests/integration/**'
      - 'tests/helpers/**'
      - 'vitest.integration.config.ts'
      - 'vitest.base.config.ts'
      - 'svelte.config.js'
      - '.github/workflows/nightly-integration.yml'
      - '.github/ci.env'
      - 'scripts/with-db-lock.sh'
      - 'scripts/lib/lock.py'
      # dépendances : version de la CLI Supabase, de supabase-js, de vitest
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # src/lib : dossiers atteints par la suite
      - 'src/lib/math/**'
      - 'src/lib/mathAST/**'
      - 'src/lib/migration/**'
      - 'src/lib/questions/**'
      - 'src/lib/resources/**'
      - 'src/lib/server/**'
      - 'src/lib/srs/**'
      - 'src/lib/ubumark/**'
      - 'src/lib/geometry-core/viewport/grid.ts'
      - 'src/lib/geometry-core/viewport/sampler.ts'
      - 'src/lib/grapheur/sequence.ts'
      - 'src/lib/utils/**'
      # src/lib : fichiers atteints ponctuellement
      - 'src/lib/components/markdown/utils/math-utils.ts'
      - 'src/lib/constants/deadlines.ts'
      - 'src/lib/exercises/services/image-dimensions.ts'
      - 'src/lib/exercises/types.ts'
      - 'src/lib/exercises/validation.ts'
      - 'src/lib/types/evaluation.ts'
      - 'src/lib/types/question-template.ts'
      - 'src/lib/validation/series.ts'
      - 'src/lib/types/chapter-templates.ts'
      - 'src/lib/types/database-helpers.ts'
      - 'src/lib/types/grades.ts'
      - 'src/lib/types/locale.ts'
      - 'src/lib/typst/image-loader.ts'
      - 'src/lib/worksheets/exercise-numbering.ts'
      # src/routes : handlers appelés directement par les tests. Chez GitHub, `[]`
      # est une classe de caractères, et `?` / `+` portent sur le caractère
      # PRÉCÉDENT (pas « un caractère quelconque ») : un segment `[id]` ou `(groupe)`
      # devient `*`, et `+server.ts` devient `*server.ts`. Vérifié par
      # `pnpm check:integration-paths` (job `paths-filter` ci-dessous).
      - 'src/routes/*/dashboard/teacher/cahier-texte/*/*/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/contenu/worksheets/*/assignments/*/progress/*page.server.ts'
      - 'src/routes/*/presques-evaluations/*page.server.ts'
      - 'src/routes/api/evaluations/assignments/*/start/*server.ts'
      - 'src/routes/api/marketplace/listings/*/proposals/*server.ts'
      - 'src/routes/api/skill-attempts/*server.ts'
      - 'src/routes/api/srs/decks/*/sections/*server.ts'
      - 'src/routes/api/srs/decks/*/sections/*/*server.ts'
      - 'src/routes/api/student/reports/*server.ts'
      - 'src/routes/api/student/worksheets/*server.ts'
      - 'src/routes/api/teacher/curriculum/activities/*server.ts'
      - 'src/routes/api/teacher/curriculum/activities/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/coverage/*server.ts'
      - 'src/routes/api/teacher/curriculum/exercise-tags/*server.ts'
      - 'src/routes/api/teacher/curriculum/objectives/*server.ts'
      - 'src/routes/api/teacher/curriculum/objectives/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/objectives/reorder/*server.ts'
      - 'src/routes/api/teacher/curriculum/points/*server.ts'
      - 'src/routes/api/teacher/curriculum/points/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/points/reorder/*server.ts'
      - 'src/routes/api/teacher/curriculum/template-tags/*server.ts'
      - 'src/routes/api/teacher/curriculum/themes/*server.ts'
      - 'src/routes/api/teacher/curriculum/themes/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/themes/reorder/*server.ts'
      - 'src/routes/api/worksheets/*server.ts'
      - 'src/routes/api/worksheets/*/*server.ts'
      - 'src/routes/api/worksheets/*/assignments/*/reports/*/*server.ts'
      - 'src/routes/api/worksheets/*/duplicate/*server.ts'
      - 'src/routes/api/worksheets/*/exercise-number/*/*server.ts'
concurrency:
  # Un nouveau push sur la même branche (ou la même PR) annule le run en cours.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paths-filter:
    # Le filtre `paths` ci-dessus suit-il encore la suite ? Une PR qui change le
    # périmètre (nouvel import) modifie forcément un fichier couvert, donc passe
    # ici. Échoue sur un fichier atteint non couvert, ou un motif mort.
    name: Integration paths filter
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the paths filter against the suite's imports
        run: pnpm check:integration-paths

  integration:
    name: Integration tests (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        # Needed so svelte-kit sync can generate $env/static members.
        run: cp .github/ci.env .env

      - name: Supabase CLI version
        # Doit afficher la version exacte de la devDependency (package.json).
        # La version sert aussi de clé au cache des images Docker (étape suivante).
        id: supabase-cli
        run: |
          version="$(pnpm exec supabase --version)"
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Cache des images Docker de la stack Supabase (2026-09-30). Sans lui, chaque
      # run les retélécharge depuis public.ecr.aws et ghcr.io, dont le quota par IP
      # est partagé entre tous les runners GitHub : `toomanyrequests: Rate exceeded`
      # faisait échouer le job avant le premier test (#562). Les versions d'images
      # sont fixées par la CLI et par `supabase/config.toml` : la clé en dépend.
      # `v1` : à incrémenter si la liste des services exclus (-x) change.
      - name: Restore Supabase Docker images
        id: supabase-images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/supabase-images.tar.zst
          key: supabase-images-v1-${{ runner.os }}-${{ steps.supabase-cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load Supabase Docker images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: zstd -dc /tmp/supabase-images.tar.zst | docker load

      - name: Start Supabase (applies migrations)
        # Stack allégée : on exclut les services non requis (studio, edge, analytics,
        # mail, imgproxy). storage-api est GARDÉ : deux suites l'appellent
        # (chapter-documents-size-limit, chat-attachment-signing). Son image était
        # introuvable avec la CLI 2.105 ; la 2.118 utilise storage-api:v1.77.0.
        # CLI Supabase = la devDependency du projet (version exacte dans
        # package.json), la même que sur les postes : une seule source de vérité.
        run: pnpm exec supabase start -x imgproxy,studio,edge-runtime,logflare,vector,mailpit,postgres-meta

      - name: Save Supabase Docker images
        # Seulement si le cache manquait et que la stack a démarré : les images
        # présentes sont alors exactement celles de cette version de la CLI.
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          images="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)supabase/' | grep -v ':<none>$')"
          echo "$images"
          test -n "$images"
          docker save $images | zstd -T0 -3 -o /tmp/supabase-images.tar.zst
          ls -lh /tmp/supabase-images.tar.zst

      - name: Upload Supabase Docker images to the cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/supabase-images.tar.zst
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}

      - name: Export local Supabase credentials
        # The test helpers read SUPABASE_TEST_* (with localhost defaults); export the
        # actual local stack keys so they match the CLI version that just started.
        # La CLI écrit `NOM="valeur"` ; $GITHUB_ENV garde les guillemets tels quels,
        # et supabase-js refuse alors l'URL (« Invalid supabaseUrl »). On les retire,
        # et on échoue ICI si l'URL manque, plutôt que 119 fichiers de tests plus loin.
        run: |
          set -o pipefail
          pnpm exec supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z0-9_]+)="(.*)"$/\1=\2/' > supabase-test.env
          grep -q '^SUPABASE_TEST_URL=http' supabase-test.env
          cat supabase-test.env >> "$GITHUB_ENV"
          # Le code applicatif appelé par certaines suites (adminElevation, endpoint
          # skill-attempts) lit $env : sans ça, il garde les adresses bidon de
          # .github/ci.env (placeholder.supabase.co). Les variables du processus
          # priment sur le .env pour Vite.
          . ./supabase-test.env
          {
            echo "PUBLIC_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop
