name: Nightly Integration Tests

# Integration tests (tests/integration/**, including tests/integration/database/
# trigger & RLS tests) need a real local Supabase stack. This spins up Supabase
# via the CLI, applies migrations, runs `pnpm test:integration`, tears it down.
#
# CRON DÉSACTIVÉ : `supabase start` échoue actuellement car l'image amont
# storage-api:fix-object-level (défaut CLI 2.105) n'est publiée sur aucun registre
# ("manifest unknown"). Tant que ce n'est pas résolu (cf. docs/wip/
# test-architecture-progress.md), on garde uniquement le déclenchement manuel
# pour éviter un job rouge toutes les nuits. Réactiver le cron une fois corrigé.

on:
  workflow_dispatch: # manual trigger only (cron disabled — see comment above)

jobs:
  integration:
    name: Integration tests (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        # Needed so svelte-kit sync can generate $env/static members.
        run: cp .github/ci.env .env

      - name: Setup Supabase CLI
        # The CLI is not a project dependency (installed via brew locally), so the
        # runner needs it explicitly before `supabase start`. Pinned to the version
        # used locally — `latest` pulled a build whose storage-api image tag
        # (fix-object-level) is unpublished → "manifest unknown".
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase (applies migrations)
        # Stack allégée : l'image storage-api renvoie "manifest unknown" (indispo sur
        # ghcr ET docker.io). Les tests d'intégration n'utilisent pas l'API HTTP
        # Storage (ils manipulent la table storage.objects en SQL), donc on exclut
        # storage + les services non requis (studio, edge, analytics, mail, imgproxy).
        run: supabase start -x storage-api,imgproxy,studio,edge-runtime,logflare,vector,mailpit,postgres-meta

      - name: Export local Supabase credentials
        # The test helpers read SUPABASE_TEST_* (with localhost defaults); export the
        # actual local stack keys so they match the CLI version that just started.
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
