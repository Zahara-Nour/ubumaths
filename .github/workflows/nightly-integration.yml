name: Nightly Integration Tests

# Integration tests (tests/integration/**, including tests/integration/database/
# trigger & RLS tests) need a real local Supabase stack. This spins up Supabase
# via the CLI, applies migrations, runs `pnpm test:integration`, tears it down.
#
# DÉCLENCHEURS (réactivés le 2026-09-29, après le premier run vert, PR #512) :
#   - chaque nuit (cron, en UTC) ;
#   - sur les PR qui touchent un fichier pouvant changer le résultat de la suite
#     (filtre `paths` ci-dessous) ;
#   - à la main (workflow_dispatch).
#
# ⚠️ Ce workflow ne doit PAS être un check obligatoire de la protection de
# `main` : filtré par `paths`, il ne tourne pas sur les autres PR, qui
# attendraient pour toujours un check qui ne vient jamais. Le cron nocturne est
# le filet pour ce que le filtre laisserait passer.

on:
  schedule:
    # 02:17 UTC = 04:17 à Paris en heure d'été, 03:17 en heure d'hiver. Minute
    # non ronde : GitHub retarde souvent les tâches planifiées à l'heure pile.
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    # Filtre établi le 2026-09-29 en calculant la fermeture transitive des
    # imports de la suite (tests/integration/**/*.test.ts + global-setup.ts).
    # Dossier entier (/**) quand la suite en atteint une bonne part, ou pour ne
    # pas rater un nouveau voisin importé ; fichiers explicites quand l'atteinte
    # est ponctuelle dans un grand dossier. Le job `paths-filter` recalcule ce
    # périmètre à chaque run et échoue si le filtre ne le suit plus
    # (`pnpm check:integration-paths` fait foi).
    paths:
      # la base, les tests et leur outillage
      - 'supabase/**'
      - 'tests/integration/**'
      - 'tests/helpers/**'
      # jeu de référence figé du dictionnaire, lu par la suite
      - 'tests/fixtures/lexique/dictionnaire-reference.ts'
      - 'tests/fixtures/lexique/mots-lecture-2026-10-11.ts'
      - 'tests/fixtures/lexique/verbes-consigne-2026-11-16.ts'
      - 'tests/fixtures/lexique/exemples-seo-2026-11-21.ts'
      - 'tests/fixtures/lexique/exemples-seo-2026-11-23.ts'
      - 'vitest.integration.config.ts'
      - 'vitest.base.config.ts'
      - 'vite.config.ts'
      - 'src/env.ts'
      - '.github/workflows/nightly-integration.yml'
      - '.github/ci.env'
      - 'scripts/with-db-lock.sh'
      - 'scripts/lib/lock.py'
      # portée d'une PR (suite complète ou tests d'une migration de données)
      - 'scripts/ci-integration-ciblee.sh'
      # tests touchés par une PR de code (et le calcul des imports qu'il partage avec la garde)
      - 'scripts/ci-integration-touches.ts'
      - 'scripts/check-integration-paths.ts'
      - 'scripts/lib/chargements-en-lot.ts'
      # empreinte d'un passage (passage déjà vert sur la PR : tests non relancés)
      - 'scripts/ci-integration-empreinte.sh'
      # tests de migration de données laissés de côté sur les PR, et leur garde
      - 'scripts/ci-integration-exclusions.sh'
      - 'scripts/lib/migrations-de-donnees.ts'
      - 'scripts/check-migrations-de-donnees.ts'
      # générateur des migrations de contenu de publiés, rejoué par la suite
      - 'scripts/lib/migration-contenu.ts'
      # générateur des migrations « nœud et tag », rejoué par la suite
      - 'scripts/lib/migration-rangement.ts'
      # mise à jour de la base locale, jouée sur une vraie base par tests/integration/db-a-jour.test.ts
      - 'scripts/db-a-jour/**'
      # pile de test locale : le global-setup de la suite en importe les règles
      - 'scripts/pile-de-test/**'
      - 'scripts/pile-de-test.sh'
      # dépendances : version de la CLI Supabase, de supabase-js, de vitest
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # src/lib : dossiers atteints par la suite
      - 'src/lib/dictionary/**'
      - 'src/lib/math/**'
      # Passage quotidien du carnet de liaison (courriels, forme du carnet)
      - 'src/lib/email-templates/**'
      - 'src/lib/validation/carnet.ts'
      - 'src/lib/mathAST/**'
      - 'src/lib/mathoux/**'
      - 'src/lib/descente/**'
      - 'src/lib/programmes/**'
      - 'src/lib/questions/**'
      - 'src/lib/resources/**'
      - 'src/lib/server/**'
      # Versions d'exercices (versions-exercices-lectures.test.ts) : import, slug, tuteur
      - 'src/lib/exercises/markdown-frontmatter.ts'
      - 'src/lib/exercises/slug-generator.ts'
      - 'src/lib/config/personalities.ts'
      - 'src/lib/srs/**'
      - 'src/lib/statistics/**'
      - 'src/lib/theme/**'
      - 'src/lib/ubumark/**'
      # Bloc ```figure : les producteurs de PDF importent l'interpréteur du DSL
      - 'src/lib/geometry-core/**'
      # Rapporteur posé imprimé (protractor-typst.ts) : rayon de référence du dessin
      - 'src/lib/constructions-v2/constants.ts'
      # Bloc ```courbe : suites (parseur)
      - 'src/lib/grapheur/sequence.ts'
      # Bloc ```qr : adresse (parseur) et matrice (générateur Typst)
      - 'src/lib/qr/**'
      # programme tortue : jugé par answer-validator (chantier blockly)
      - 'src/lib/shared/blockly/tortue/**'
      # programme de calcul et lecture commune des blocs : jugés par answer-validator
      - 'src/lib/shared/blockly/calcul/**'
      - 'src/lib/shared/blockly/lecture.ts'
      - 'src/lib/shared/blockly/nombres.ts'
      - 'src/lib/seo/site.ts'
      - 'src/lib/utils/**'
      # src/lib : fichiers atteints ponctuellement
      # Pages du glossaire : la lecture du dictionnaire importe findPrincipal
      - 'src/lib/dictionary/card.ts'
      - 'src/lib/components/markdown/utils/math-utils.ts'
      - 'src/lib/dev/supabase-relay.ts'
      - 'src/lib/constants/deadlines.ts'
      - 'src/lib/exercises/services/image-dimensions.ts'
      - 'src/lib/exercises/types.ts'
      - 'src/lib/exercises/validation.ts'
      - 'src/lib/games/leaderboards.ts'
      # Chat et échanges : les stores clients tournent contre Realtime local (canal privé)
      - 'src/lib/stores/chat.svelte.ts'
      - 'src/lib/stores/supabaseRealtime.svelte.ts'
      - 'src/lib/stores/toaster.svelte.ts'
      - 'src/lib/stores/tradeRealtime.svelte.ts'
      - 'src/lib/types/evaluation.ts'
      - 'src/lib/types/evaluation-attempt.ts'
      - 'src/lib/types/evaluation-breakdown.ts'
      - 'src/lib/types/duration-signals.ts'
      - 'src/lib/types/question-template.ts'
      - 'src/lib/validation/series.ts'
      - 'src/lib/types/buddy.ts'
      - 'src/lib/types/chapter-templates.ts'
      - 'src/lib/types/chapters.ts'
      - 'src/lib/types/database-helpers.ts'
      - 'src/lib/types/grades.ts'
      - 'src/lib/types/locale.ts'
      - 'src/lib/types/vip-card.ts'
      - 'src/lib/typst/correction-fonts.ts'
      - 'src/lib/typst/image-loader.ts'
      - 'src/lib/typst/labels.ts'
      - 'src/lib/typst/text-size.ts'
      - 'src/lib/typst/templates/default-templates.ts'
      - 'src/lib/typst/templates/styles.ts'
      - 'src/lib/typst/templates/site-mark.ts'
      - 'src/lib/typst/templates/index.ts'
      - 'src/lib/worksheets/exercise-numbering.ts'
      - 'src/lib/worksheets/exercise-anchor.ts'
      - 'src/lib/worksheets/student-copy.ts'
      - 'src/lib/worksheets/worksheet-copy.ts'
      - 'src/lib/worksheets/worksheet-header.ts'
      - 'src/lib/worksheets/worksheet-title.ts'
      - 'src/lib/worksheets/document/answer-frames.ts'
      - 'src/lib/worksheets/document/answer-frame-lines.ts'
      - 'src/lib/exercises/generator/instance-generator.ts'
      - 'src/lib/types/worksheets.ts'
      # Corrigé de classe (versions-exercices-lectures.test.ts) : chaîne PDF Typst
      - 'src/lib/typst/easy-reading.ts'
      - 'src/lib/typst/generators/**'
      - 'src/lib/typst/types.ts'
      - 'src/lib/typst/utils/**'
      - 'src/lib/typst/worksheet-palette.ts'
      - 'src/lib/worksheets/document/math-limits.ts'
      - 'src/lib/worksheets/document/numbering.ts'
      - 'src/lib/worksheets/document/render-exercise.ts'
      - 'src/lib/worksheets/document/teacher-adapter.ts'
      - 'src/lib/worksheets/pdf-file-name.ts'
      # src/routes : handlers appelés directement par les tests. Chez GitHub, `[]`
      # est une classe de caractères, et `?` / `+` portent sur le caractère
      # PRÉCÉDENT (pas « un caractère quelconque ») : un segment `[id]` ou `(groupe)`
      # devient `*`, et `+server.ts` devient `*server.ts`. Vérifié par
      # `pnpm check:integration-paths` (job `paths-filter` ci-dessous).
      - 'src/routes/*/dashboard/teacher/cahier-texte/*/*/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/contenu/worksheets/*/assignments/*/progress/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/contenu/worksheets/templates/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/contenu/worksheets/templates/*/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/programme/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/cours/*/*/*page.server.ts'
      - 'src/routes/*/dashboard/teacher/contenu/templates/*/*page.server.ts'
      - 'src/routes/*/presques-evaluations/*page.server.ts'
      - 'src/routes/*/automaths/test/*page.server.ts'
