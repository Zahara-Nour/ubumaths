      - 'src/routes/api/marketplace/proposals/*/*server.ts'
      - 'src/routes/api/marketplace/trades/*/confirm/*server.ts'
      - 'src/routes/api/vip-cards/choose/*server.ts'
      - 'src/routes/api/vip-cards/exchange/*server.ts'
      - 'src/routes/api/skill-attempts/*server.ts'
      - 'src/routes/api/srs/chapters/*/due/*server.ts'
      - 'src/routes/api/srs/chapters/*/submit/*server.ts'
      - 'src/routes/api/srs/decks/*/sections/*server.ts'
      - 'src/routes/api/srs/decks/*/sections/*/*server.ts'
