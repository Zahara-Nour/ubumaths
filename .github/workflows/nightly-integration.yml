      - 'src/routes/api/worksheets/assignments/*/correction/*server.ts'
      # Versions d'un exercice (versions-exercices-editeur.test.ts)
      - 'src/routes/api/exercises/*/*server.ts'
      - 'src/routes/api/exercises/*/versions/*server.ts'
      - 'src/routes/api/exercises/*/versions/*/*server.ts'
      - 'src/routes/api/worksheets/*/exercises/*server.ts'
      - 'src/routes/api/worksheets/*/exercises/*/version/*server.ts'
      - 'src/routes/api/tutor/conversations/*server.ts'
      - 'src/routes/api/worksheets/assignments/*/students/*server.ts'
      - 'src/routes/api/teacher/curriculum/activities/*server.ts'
      - 'src/routes/api/teacher/curriculum/activities/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/coverage/*server.ts'
      - 'src/routes/api/teacher/curriculum/exercise-tags/*server.ts'
      - 'src/routes/api/teacher/curriculum/points/*/*server.ts'
      - 'src/routes/api/teacher/curriculum/template-tags/*server.ts'
      - 'src/routes/api/worksheets/*server.ts'
      - 'src/routes/api/documents/*/*server.ts'
      - 'src/routes/api/teacher/chapter-templates/*/document-upload-url/*server.ts'
      - 'src/routes/api/teacher/chapter-templates/*/documents/*server.ts'
      - 'src/routes/api/teacher/chapters/*/documents/*/*server.ts'
      - 'src/routes/api/teacher/chapters/*/checklist/*/*server.ts'
      - 'src/routes/api/teacher/chapters/*/exercises/*/*server.ts'
      - 'src/routes/api/worksheets/*/*server.ts'
      - 'src/routes/api/worksheets/*/assignments/*/reports/*/*server.ts'
      - 'src/routes/api/worksheets/*/duplicate/*server.ts'
      - 'src/routes/api/worksheets/*/exercise-number/*/*server.ts'
concurrency:
  # Un nouveau push sur la même branche (ou la même PR) annule le run en cours.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paths-filter:
    # Le filtre `paths` ci-dessus suit-il encore la suite ? Une PR qui change le
    # périmètre (nouvel import) modifie forcément un fichier couvert, donc passe
    # ici. Échoue sur un fichier atteint non couvert, ou un motif mort.
    name: Integration paths filter
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the paths filter against the suite's imports
        run: pnpm check:integration-paths

      - name: Tests marqués @migration-de-donnees (aucun ne rejoue une migration de schéma)
        # Les tests marqués ne tournent pas sur les PR (job `portee`) : la garde refuse la
        # mention sur un test dont la migration touche le schéma ou les règles d'accès.
        run: pnpm check:migrations-de-donnees

  portee:
    # Portée et découpage, calculés UNE fois pour tous les morceaux.
    name: Integration scope
    runs-on: ubuntu-latest
    timeout-minutes: 10 # install + calcul des imports (tests touchés)
    outputs:
      fichiers: ${{ steps.selection.outputs.fichiers }}
      aucun: ${{ steps.touches.outputs.aucun == 'true' && 'true' || 'false' }}
      sauter: ${{ (steps.deja-vert.outputs.cache-hit == 'true' || steps.touches.outputs.aucun == 'true') && 'true' || 'false' }}
      exclure: ${{ steps.exclusions.outputs.exclure }}
      morceaux: ${{ steps.morceaux.outputs.morceaux }}
      total: ${{ steps.morceaux.outputs.total }}
      empreinte: ${{ steps.empreinte.outputs.empreinte }}
      deja_vert: ${{ steps.deja-vert.outputs.cache-hit == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Le commit de merge et la base (HEAD^1) : scripts/ci-integration-ciblee.sh
          fetch-depth: 2

      - name: Portée (suite complète, ou seulement les tests d'une migration de données)
        # PR qui ne fait qu'AJOUTER une migration avec son test (rangement d'un lot de
        # modèles : ~19 min de suite complète pour 3 brouillons, 2026-11-20) : seuls ses
        # tests tournent, la stack appliquant quand même toutes les migrations. Toute
        # autre PR, le cron et workflow_dispatch : suite complète. Le cron est le filet.
        id: portee
        run: bash scripts/ci-integration-ciblee.sh >> "$GITHUB_OUTPUT" || echo "fichiers=" >> "$GITHUB_OUTPUT"

      # Tests touchés (PR de code) : il faut les dépendances (esbuild) pour lire les imports.
      - name: Setup pnpm
        if: github.event_name == 'pull_request' && steps.portee.outputs.fichiers == ''
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: github.event_name == 'pull_request' && steps.portee.outputs.fichiers == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name == 'pull_request' && steps.portee.outputs.fichiers == ''
        run: pnpm install --frozen-lockfile

      - name: Tests touchés (PR qui ne modifie que du code, de la doc, des tests d'intégration)
        # Seuls tournent les tests dont les imports atteignent un fichier modifié ; aucun test
        # atteint → rien à lancer (`aucun=true`). Hors de ce cas : suite complète. Sur les PR
        # `src/` seules mesurées, 0 à 20 tests au lieu de toute la suite (2026-11-21).
        # Décision : docs/archive/wip/ci-integration-progress.md § 9.
        id: touches
        if: github.event_name == 'pull_request' && steps.portee.outputs.fichiers == ''
        run: |
          pnpm exec tsx scripts/ci-integration-touches.ts > touches.out || printf 'fichiers=\naucun=false\n' > touches.out
          cat touches.out >> "$GITHUB_OUTPUT"

      - name: Tests retenus
        id: selection
        env:
          CIBLEE: ${{ steps.portee.outputs.fichiers }}
          TOUCHES: ${{ steps.touches.outputs.fichiers }}
        run: echo "fichiers=${CIBLEE:-$TOUCHES}" >> "$GITHUB_OUTPUT"

      - name: Tests de migration de données laissés de côté (PR en suite complète)
        # ~300 tests rejouent une migration qui ne fait que ranger, taguer ou corriger du
        # contenu : ils ne prouvent quelque chose qu'avant son `db:migrate` (~5 min de suite,
        # 2026-11-21). Sur une PR, seuls tournent ceux qu'elle touche (le test ou sa migration) ;
        # la nuit et à la main, tous. Décision et tri : docs/archive/wip/ci-integration-progress.md § 7.
        id: exclusions
        if: steps.selection.outputs.fichiers == '' && steps.touches.outputs.aucun != 'true'
        run: bash scripts/ci-integration-exclusions.sh >> "$GITHUB_OUTPUT" || echo "exclure=" >> "$GITHUB_OUTPUT"

      - name: Morceaux (4 pour la suite complète ou plus de 40 tests, 1 sinon)
        # Suite en série (un fichier à la fois, isolation par purge globale) : on ne peut
        # pas paralléliser DANS une stack. On découpe donc en jobs, une stack chacun
        # (2026-11-21 : 584 fichiers, ~15 min de tests en un seul job). Coût fixe d'un
        # job ~2 min (install, images, `supabase start`) : inutile pour quelques tests.
        id: morceaux
        env:
          FICHIERS: ${{ steps.selection.outputs.fichiers }}
          AUCUN: ${{ steps.touches.outputs.aucun }}
        run: |
          n=$(wc -w <<<"$FICHIERS")
          if [ "$AUCUN" = "true" ] || { [ -n "$FICHIERS" ] && [ "$n" -le 40 ]; }; then
            echo 'morceaux=[1]' >> "$GITHUB_OUTPUT"; echo 'total=1' >> "$GITHUB_OUTPUT"
          else
            echo 'morceaux=[1,2,3,4]' >> "$GITHUB_OUTPUT"; echo 'total=4' >> "$GITHUB_OUTPUT"
          fi

      - name: Empreinte du passage (fichiers dont dépend la suite + portée)
        # Sur 37 pushes de correction, 20 ne touchaient aucun fichier de la suite et relançaient
        # 16 à 20 min pour un résultat identique (2026-11-21). Seulement sur les PR ; vide dans
        # le doute (la suite tourne). Décision : docs/archive/wip/ci-integration-progress.md § 8.
        id: empreinte
        if: github.event_name == 'pull_request'
        env:
          FICHIERS: ${{ steps.selection.outputs.fichiers }}
          EXCLURE: ${{ steps.exclusions.outputs.exclure }}
          TOTAL: ${{ steps.morceaux.outputs.total }}
        run: bash scripts/ci-integration-empreinte.sh >> "$GITHUB_OUTPUT" || echo "empreinte=" >> "$GITHUB_OUTPUT"

      - name: Passage déjà vert sur cette empreinte ?
        # Trace laissée par le job `memoriser` d'un passage entièrement vert de la même PR (le
        # cache d'une PR n'est lu que par elle et par ses pushes suivants).
        id: deja-vert
        if: steps.empreinte.outputs.empreinte != ''
        uses: actions/cache/restore@v6
        with:
          path: .integration-vert
          key: integration-vert-v1-${{ steps.empreinte.outputs.empreinte }}

      - name: Run d'origine
        if: steps.deja-vert.outputs.cache-hit == 'true'
        run: |
          echo "Déjà vert, même empreinte : $(cat .integration-vert/run.txt)"

  integration:
    name: Integration tests (shard ${{ matrix.shard }}/${{ needs.portee.outputs.total }})
    needs: portee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Un morceau rouge n'annule pas les autres : on veut tous les échecs d'un coup.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.portee.outputs.morceaux) }}

    steps:
      - name: Passage déjà vert sur cette PR (même empreinte)
        # Les étapes suivantes sont sautées, le job passe : le check garde son nom et finit en
        # ✅ plutôt qu'en « skipped ». Run d'origine : job `portee`, étape « Run d'origine ».
        if: needs.portee.outputs.deja_vert == 'true'
        run: |
          echo "Déjà vert sur l'empreinte ${{ needs.portee.outputs.empreinte }} : tests non relancés."

      - name: Aucun test n'atteint les fichiers modifiés
        # PR de code qu'aucun test d'intégration n'importe : rien à lancer, même affichage.
        if: needs.portee.outputs.aucun == 'true' && needs.portee.outputs.deja_vert != 'true'
        run: echo "Aucun test n'atteint les fichiers modifiés (job portee, étape « Tests touchés »)."

      - name: Checkout code
        if: needs.portee.outputs.sauter != 'true'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: needs.portee.outputs.sauter != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: needs.portee.outputs.sauter != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.portee.outputs.sauter != 'true'
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        if: needs.portee.outputs.sauter != 'true'
        # Needed so svelte-kit sync can generate $env/static members.
        run: cp .github/ci.env .env

      - name: Supabase CLI version
        if: needs.portee.outputs.sauter != 'true'
        # Doit afficher la version exacte de la devDependency (package.json).
        # La version sert aussi de clé au cache des images Docker (étape suivante).
        id: supabase-cli
        run: |
          version="$(pnpm exec supabase --version)"
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Cache des images Docker de la stack Supabase (2026-09-30). Sans lui, chaque
      # run les retélécharge depuis public.ecr.aws et ghcr.io, dont le quota par IP
      # est partagé entre tous les runners GitHub : `toomanyrequests: Rate exceeded`
      # faisait échouer le job avant le premier test (#562). Les versions d'images
      # sont fixées par la CLI et par `supabase/config.toml` : la clé en dépend.
      # `v1` : à incrémenter si la liste des services exclus (-x) change.
      - name: Restore Supabase Docker images
        if: needs.portee.outputs.sauter != 'true'
        id: supabase-images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/supabase-images.tar.zst
          key: supabase-images-v1-${{ runner.os }}-${{ steps.supabase-cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load Supabase Docker images
        if: (steps.supabase-images.outputs.cache-hit == 'true') && needs.portee.outputs.sauter != 'true'
        run: zstd -dc /tmp/supabase-images.tar.zst | docker load

      - name: Start Supabase (applies migrations)
        if: needs.portee.outputs.sauter != 'true'
        # Stack allégée : on exclut les services non requis (studio, edge, analytics,
        # mail, imgproxy). storage-api est GARDÉ : deux suites l'appellent
        # (chapter-documents-size-limit, chat-attachment-signing). Son image était
        # introuvable avec la CLI 2.105 ; la 2.118 utilise storage-api:v1.77.0.
        # CLI Supabase = la devDependency du projet (version exacte dans
        # package.json), la même que sur les postes : une seule source de vérité.
        run: pnpm exec supabase start -x imgproxy,studio,edge-runtime,logflare,vector,mailpit,postgres-meta

      - name: Save Supabase Docker images
        # Seulement si le cache manquait et que la stack a démarré : les images
        # présentes sont alors exactement celles de cette version de la CLI.
        # Un seul morceau enregistre : les autres viseraient la même clé en même temps.
        if: (steps.supabase-images.outputs.cache-hit != 'true' && matrix.shard == 1) && needs.portee.outputs.sauter != 'true'
        run: |
          set -o pipefail
          images="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)supabase/' | grep -v ':<none>$')"
          echo "$images"
          test -n "$images"
          docker save $images | zstd -T0 -3 -o /tmp/supabase-images.tar.zst
          ls -lh /tmp/supabase-images.tar.zst

      - name: Upload Supabase Docker images to the cache
        if: (steps.supabase-images.outputs.cache-hit != 'true' && matrix.shard == 1) && needs.portee.outputs.sauter != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/supabase-images.tar.zst
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}

      - name: Export local Supabase credentials
        if: needs.portee.outputs.sauter != 'true'
        # The test helpers read SUPABASE_TEST_* (with localhost defaults); export the
        # actual local stack keys so they match the CLI version that just started.
        # La CLI écrit `NOM="valeur"` ; $GITHUB_ENV garde les guillemets tels quels,
        # et supabase-js refuse alors l'URL (« Invalid supabaseUrl »). On les retire,
        # et on échoue ICI si l'URL manque, plutôt que 119 fichiers de tests plus loin.
        run: |
          set -o pipefail
          pnpm exec supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z0-9_]+)="(.*)"$/\1=\2/' > supabase-test.env
          grep -q '^SUPABASE_TEST_URL=http' supabase-test.env
          cat supabase-test.env >> "$GITHUB_ENV"
          # Le code applicatif appelé par certaines suites (adminElevation, endpoint
          # skill-attempts) lit $env : sans ça, il garde les adresses bidon de
          # .github/ci.env (placeholder.supabase.co). Les variables du processus
          # priment sur le .env pour Vite.
          . ./supabase-test.env
          {
            echo "PUBLIC_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run integration tests (shard ${{ matrix.shard }}/${{ needs.portee.outputs.total }})
        if: needs.portee.outputs.sauter != 'true'
        env:
          FICHIERS: ${{ needs.portee.outputs.fichiers }}
          EXCLURE: ${{ needs.portee.outputs.exclure }}
        # $FICHIERS vide = suite complète ; sinon la liste des tests de la PR (non citée :
        # un argument par fichier, les chemins n'ont pas d'espace). $EXCLURE : tests de
        # migration de données laissés de côté, un `--exclude` chacun (avant le découpage).
        # `--shard` de vitest répartit les fichiers par nombre (empreinte du chemin), pas
        # par durée.
        run: |
          exclusions=()
          for f in $EXCLURE; do exclusions+=(--exclude "$f"); done
          echo "Tests de migration de données laissés de côté : $(( ${#exclusions[@]} / 2 ))"
          pnpm test:integration $FICHIERS "${exclusions[@]}" --shard=${{ matrix.shard }}/${{ needs.portee.outputs.total }}

      - name: Stop Supabase
        if: (always()) && needs.portee.outputs.sauter != 'true'
        run: pnpm exec supabase stop

  memoriser:
    # Passage entièrement vert d'une PR (garde du filtre, portée, tous les morceaux) : on garde
    # son empreinte, qu'un push suivant de la même PR retrouvera (job `portee`). Pas de `if` au
    # niveau du job : sauté, il s'afficherait « skipped » ; ses étapes le sont à la place.
    # Un morceau rouge ou annulé : le job ne tourne pas, rien n'est gardé.
    name: Integration green pass memo
    needs: [paths-filter, portee, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trace du passage vert
        if: needs.portee.outputs.empreinte != '' && needs.portee.outputs.deja_vert != 'true'
        run: |
          mkdir -p .integration-vert
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > .integration-vert/run.txt
          cat .integration-vert/run.txt

      - name: Garder l'empreinte
        if: needs.portee.outputs.empreinte != '' && needs.portee.outputs.deja_vert != 'true'
        uses: actions/cache/save@v6
        with:
          path: .integration-vert
          key: integration-vert-v1-${{ needs.portee.outputs.empreinte }}
