name: Code Quality

on:
  push:
    branches: [main, dev, feature/**]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Allow manual trigger

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm prettier --check .

      - name: Run ESLint
        run: pnpm eslint . --cache

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder env so `svelte-kit sync` emits the $env/static members.
      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Run svelte-check
        run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Build
        run: pnpm build

  # Server tests (node env): the real regression gate — fast, deterministic,
  # no browser. Sharded for parallelism.
  test-server:
    name: Server Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Run server tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --project server --shard=${{ matrix.shard }}/4

  # Client tests (browser/chromium): unit + mocked component tests.
  # The real-Pyodide integration tests (*-real.svelte.test.ts) are excluded
  # here — they download and run Python in headless Chromium (slow + flaky in
  # CI) and stay runnable locally.
  test-client:
    name: Client Tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The real-Pyodide integration tests are excluded via vite.config.ts
      # (gated on CI=true), since the CLI --exclude flag does not propagate to
      # project configs in vitest's projects mode.
      - name: Run client tests
        run: pnpm exec vitest run --project client

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test-server, test-client]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Server Tests: ${{ needs.test-server.result }}"
          echo "Client Tests: ${{ needs.test-client.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test-server.result }}" != "success" ] || \
             [ "${{ needs.test-client.result }}" != "success" ]; then
            echo "::error::Some checks failed"
            exit 1
          else
            echo "All checks passed!"
          fi
