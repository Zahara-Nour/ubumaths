name: Code Quality

on:
  push:
    branches: [main, dev, feature/**]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, dev]
    # No paths-ignore here: with required status checks on `main`, EVERY PR must
    # run CI so those checks always report. Otherwise a doc-only PR would have
    # "expected" required checks that never run → it could never be merged.
  workflow_dispatch: # Allow manual trigger

# Cancel an in-progress run when a newer commit is pushed to the same ref —
# saves Actions minutes (free tier) instead of running stale + fresh in parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm prettier --check .

      # Persist eslint's per-file cache across runs so a PR only re-lints CHANGED
      # files instead of the whole tree (the type-aware lint is the slow part).
      # The key is unique per commit (always saves a fresh cache); restore-keys
      # fall back to the most recent compatible cache. eslint invalidates entries
      # itself when a file or the config changes, so this is correctness-safe.
      # Key prefix is versioned (-content) so the new content-strategy cache
      # starts clean and never restores a stale metadata-strategy cache.
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-content-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-content-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.*') }}-
            eslint-content-${{ runner.os }}-

      # --cache-strategy content (NOT the default mtime): CI checkouts rewrite
      # every file's mtime, so the default strategy treats all files as changed
      # and the cache is useless. Hashing content is stable across checkouts.
      - name: Run ESLint
        run: pnpm eslint . --cache --cache-strategy content

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder env so `svelte-kit sync` emits the $env/static members.
      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Run svelte-check
        run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Build
        run: pnpm build

      # Guardrail for the Safari/iPad WebKit TDZ bug (docs/ref/safari-webkit-tdz.md):
      # the root layout node chunk must stay < 100 KB, otherwise iPad/Safari throws
      # "Cannot access 'universal' before initialization". Fails the build if exceeded.
      - name: Guard root layout chunk size (< 100 KB — Safari TDZ)
        run: |
          files=$(ls .svelte-kit/output/client/_app/immutable/nodes/0.*.js 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::Root layout chunk (nodes/0.*.js) not found — build output changed?"
            exit 1
          fi
          size=$(cat $files | wc -c | tr -d ' ')
          limit=102400
          echo "Root layout chunk: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Root layout chunk $size B > 100 KB — Safari/iPad TDZ risk (see docs/ref/safari-webkit-tdz.md). Move heavy static imports out of src/routes/+layout.ts."
            exit 1
          fi
          echo "::notice::Root layout chunk OK ($size B < 100 KB)"

  # Server tests (node env): the real regression gate — fast, deterministic,
  # no browser. Sharded for parallelism.
  test-server:
    name: Server Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Run server tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --project server --shard=${{ matrix.shard }}/4

  # Client tests (browser/chromium): unit + mocked component tests.
  # The real-Pyodide integration tests (*-real.svelte.test.ts) are excluded
  # here — they download and run Python in headless Chromium (slow + flaky in
  # CI) and stay runnable locally.
  test-client:
    name: Client Tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The real-Pyodide integration tests are excluded via vite.config.ts
      # (gated on CI=true), since the CLI --exclude flag does not propagate to
      # project configs in vitest's projects mode.
      - name: Run client tests
        run: pnpm exec vitest run --project client

  # Security gate for production dependencies (incl. transitive vulns Dependabot
  # can't auto-PR for pnpm — those need `pnpm.overrides`). Tuned to avoid locking
  # a solo maintainer out of merges over an unfixable/upstream-lagging advisory:
  #   - CRITICAL → job fails → wired into `summary.needs` → BLOCKS the merge.
  #   - HIGH     → warning annotation only → visible, never blocks.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # High severity → warning only (visible in the run, never fails the job).
      - name: Report high-severity prod vulns (non-blocking)
        run: |
          pnpm audit --audit-level high --prod \
            || echo "::warning title=Security::Production high-severity vulnerabilities present — run 'pnpm audit --prod' and consider a pnpm.overrides bump."

      # Critical → fails the job. `audit` is in `summary.needs`, and CI Summary is
      # a required check, so a critical prod vuln blocks the merge.
      - name: Fail on critical prod vulns (blocking)
        run: pnpm audit --audit-level critical --prod

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test-server, test-client, audit]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Server Tests: ${{ needs.test-server.result }}"
          echo "Client Tests: ${{ needs.test-client.result }}"
          echo "Security Audit (critical): ${{ needs.audit.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test-server.result }}" != "success" ] || \
             [ "${{ needs.test-client.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "::error::Some checks failed"
            exit 1
          else
            echo "All checks passed!"
          fi
