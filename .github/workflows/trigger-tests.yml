name: Database Trigger Tests

# Run on release branches only (not every PR for faster CI)
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local instance
        run: npx supabase start

      - name: Run trigger tests
        run: pnpm test:triggers

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-test-results
          path: |
            test-results/
            .supabase/logs/
          retention-days: 7
