name: Nightly Pyodide Tests

# The real-Pyodide integration tests (*-real.svelte.test.ts) download and run
# Python in headless Chromium — too slow/flaky for every push, so they're excluded
# from the main CI (vite.config.ts gate). This job re-includes them once a day via
# RUN_PYODIDE_REAL=1, restoring coverage without slowing the push loop.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: # manual trigger

jobs:
  pyodide-real:
    name: Real-Pyodide integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env (placeholders)
        run: cp .github/ci.env .env

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run real-Pyodide tests
        env:
          RUN_PYODIDE_REAL: '1'
        # `globstar` makes bash expand `**` recursively into the actual test file
        # paths. Without it (bash's default), `**` collapses to `*` (one level),
        # the deep `-real.svelte.test.ts` files never match, and the literal glob
        # is handed to vitest — which treats positional args as substring filters,
        # not globs, so it finds nothing and exits 1 ("No test files found").
        # `failglob` turns a genuinely-empty match into a loud error instead of a
        # silent full-suite run.
        run: |
          shopt -s globstar failglob
          pnpm exec vitest run --project client src/**/*-real.svelte.test.ts
