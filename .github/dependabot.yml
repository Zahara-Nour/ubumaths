version: 2
updates:
  # npm / pnpm dependencies — grouped & monthly to stay low-noise.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Une version n'est proposée qu'après 3 jours : une version piégée est
    # presque toujours retirée en quelques heures (audit du 2026-10-11 ; les
    # patch et mineures sont fusionnées automatiquement). Même délai que
    # `minimumReleaseAge` de pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    groups:
      # One PR for all non-major bumps (patch + minor).
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Separate PRs per major (breaking) bump, so they're reviewed individually.
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci(deps)
