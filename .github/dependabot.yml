version: 2
updates:
  # npm / pnpm dependencies — grouped & monthly to stay low-noise.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major bumps (patch + minor).
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Separate PRs per major (breaking) bump, so they're reviewed individually.
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci(deps)
