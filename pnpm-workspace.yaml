# Réglages pnpm du projet. Depuis pnpm 11, pnpm ne lit plus le champ "pnpm" de
# package.json : overrides et autorisations de build vivent ici
# (https://pnpm.io/migration, https://pnpm.io/settings/build).

# Correctifs de sécurité : planchers de version, et deux épinglages exacts.
overrides:
  esbuild: '>=0.28.1'
  parse5: 7.2.1
  jsdom: 26.1.0
  dompurify@3: ^3.4.12
  form-data@4: ^4.0.6
  js-yaml@4: ^4.3.2
  tar: '>=7.5.21'
  brace-expansion: '>=5.0.9'
  fast-uri: '>=4.1.4'
  postcss: '>=8.5.18'
  nanoid@3: '>=3.3.18'
  cookie: '>=0.7.0'

# Scripts d'installation des dépendances. pnpm 12 fait échouer l'installation
# (strictDepBuilds, actif par défaut) sur tout script ni autorisé ni refusé.
allowBuilds:
  # binaire natif requis par vite / vitest
  esbuild: true
  # arrive par jspdf ; son script n'affiche qu'un appel au financement
  core-js: false
