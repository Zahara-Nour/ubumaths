<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 530" width="660" height="530" font-family="Helvetica, Arial, sans-serif">
<title>Thalès mesure le puits avec les ombres</title>
<desc>Coupe du puits. Les rayons du soleil, parallèles, passent au ras du bord gauche. L'ombre du bord couvre 3 mètres du fond. Thalès mesure 1,60 mètre et son ombre 0,40 mètre : la hauteur vaut 4 fois l'ombre, donc le puits est profond de 4 fois 3, soit 12 mètres.</desc>
<rect x="0" y="0" width="660" height="530" rx="18" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker></defs>
<rect x="20" y="70" width="270" height="356" fill="#d7ccc8"/>
<rect x="402" y="70" width="238" height="356" fill="#d7ccc8"/>
<rect x="290" y="406" width="112" height="20" fill="#d7ccc8"/>
<polygon points="290,70 290,406 374,406" fill="#9e9e9e" opacity="0.45"/>
<line x1="20" y1="70" x2="640" y2="70" stroke="#3c4043" stroke-width="2"/>
<line x1="165" y1="10" x2="195" y2="70" stroke="#f9ab00" stroke-width="2" opacity="0.7"/>
<line x1="220" y1="10" x2="250" y2="70" stroke="#f9ab00" stroke-width="2" opacity="0.7"/>
<line x1="275" y1="10" x2="374" y2="406" stroke="#f9ab00" stroke-width="3"/>
<line x1="330" y1="10" x2="360" y2="70" stroke="#f9ab00" stroke-width="2" opacity="0.7"/>
<circle cx="230" cy="30" r="16" fill="#f9ab00"/>
<line x1="390.8" y1="406" x2="390.8" y2="361.2" stroke="#d93025" stroke-width="5"/>
<circle cx="390.8" cy="355.2" r="6" fill="#d93025"/>
<line x1="384.8" y1="349.2" x2="402.0" y2="406" stroke="#f9ab00" stroke-width="2"/>
<line x1="390.8" y1="404" x2="402.0" y2="404" stroke="#3c4043" stroke-width="4"/>
<line x1="560" y1="70" x2="560" y2="406" stroke="#1a73e8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="550" y="238" text-anchor="end" font-size="16" fill="#1a73e8">profondeur : ?</text>
<line x1="290" y1="452" x2="374" y2="452" stroke="#1a73e8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="332.0" y="478" text-anchor="middle" font-size="15" fill="#1a73e8">ombre du bord : 3 m</text>
<text x="412.8" y="365.2" text-anchor="start" font-size="15" fill="#d93025">Thalès : 1,60 m</text>
<text x="412.8" y="383.2" text-anchor="start" font-size="15" fill="#d93025">son ombre : 0,40 m</text>
<text x="330" y="515" text-anchor="middle" font-size="16" fill="#3c4043">hauteur = 4 × ombre, donc profondeur = 4 × 3 = 12 m</text>
</svg>
