<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Helvetica, Arial, sans-serif">
<title>Armoire relevée sous le plafond : la diagonale touche</title>
<desc>Une armoire couchée sur le dos est relevée en pivotant sur l'arête restée au sol. À mi-chemin, sa diagonale est verticale et son coin touche le plafond.</desc>
<defs><pattern id="hachures" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#9aa0a6" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="680" height="430" rx="18" fill="#ffffff"/>
<!-- plafond -->
<rect x="20" y="42" width="640" height="14" fill="url(#hachures)"/>
<line x1="20" y1="56" x2="660" y2="56" stroke="#5f6368" stroke-width="3"/>
<text x="652" y="78" text-anchor="end" font-size="15" fill="#3c4043">plafond : 2,45 m</text>
<!-- sol -->
<rect x="20" y="350" width="640" height="14" fill="url(#hachures)"/>
<line x1="20" y1="350" x2="660" y2="350" stroke="#5f6368" stroke-width="3"/>
<!-- armoire couchée (départ) -->
<polygon points="170.0,350.0 458.0,350.0 458.0,250.0 170.0,250.0" fill="#f3dfc1" stroke="#b0835a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="314.0" y="305.0" text-anchor="middle" font-size="14" fill="#7a5532">couchée sur le dos</text>
<text x="314.0" y="382" text-anchor="middle" font-size="14" fill="#3c4043">hauteur 2,40 m</text>
<text x="470" y="305.0" font-size="14" fill="#3c4043">profondeur 60 cm</text>
<!-- trajectoire du coin -->
<path d="M458.0,250.0 L456.4,245.6 L454.8,241.1 L453.1,236.8 L451.3,232.4 L449.4,228.1 L447.5,223.8 L445.5,219.5 L443.5,215.2 L441.4,211.0 L439.2,206.9 L436.9,202.7 L434.6,198.6 L432.2,194.5 L429.8,190.5 L427.3,186.5 L424.8,182.5 L422.1,178.6 L419.5,174.7 L416.7,170.9 L413.9,167.1 L411.1,163.4 L408.2,159.7 L405.2,156.0 L402.2,152.4 L399.1,148.8 L395.9,145.3 L392.7,141.8 L389.5,138.4 L386.2,135.1 L382.9,131.7 L379.5,128.5 L376.0,125.3 L372.5,122.1 L369.0,119.0 L365.4,116.0 L361.7,113.0 L358.0,110.0 L354.3,107.2 L350.5,104.3 L346.7,101.6 L342.9,98.9 L339.0,96.2 L335.0,93.6 L331.0,91.1 L327.0,88.7 L322.9,86.3 L318.9,83.9 L314.7,81.7 L310.6,79.5 L306.4,77.3 L302.1,75.3 L297.9,73.2 L293.6,71.3 L289.3,69.4 L284.9,67.6 L280.5,65.9 L276.1,64.2 L271.7,62.6 L267.2,61.1 L262.8,59.6 L258.3,58.2 L253.7,56.9 L249.2,55.6 L244.6,54.4 L240.1,53.3 L235.5,52.2 L230.9,51.3 L226.2,50.4 L221.6,49.5 L216.9,48.8 L212.3,48.1 L207.6,47.5 L202.9,46.9 L198.2,46.4 L193.5,46.0 L188.8,45.7 L184.1,45.5 L179.4,45.3 L174.7,45.2 L170.0,45.1" fill="none" stroke="#e8710a" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round"/>
<!-- armoire à mi-chemin -->
<polygon points="170.0,350.0 264.5,77.9 170.0,45.1 75.5,317.2" fill="#e9c79a" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
<line x1="170" y1="350" x2="170.0" y2="45.1" stroke="#d93025" stroke-width="3.5" stroke-dasharray="10 6"/>
<text x="110" y="168" text-anchor="end" font-size="16" font-weight="bold" fill="#d93025">diagonale</text>
<text x="110" y="190" text-anchor="end" font-size="16" font-weight="bold" fill="#d93025">≈ 2,47 m</text>
<!-- point de choc -->
<circle cx="170.0" cy="56" r="13" fill="none" stroke="#d93025" stroke-width="3"/>
<text x="152" y="94" text-anchor="end" font-size="17" font-weight="bold" fill="#d93025">ça touche !</text>
<!-- pivot -->
<circle cx="170" cy="350" r="5" fill="#3c4043"/>
<text x="160" y="378" text-anchor="end" font-size="13" fill="#5f6368">arête au sol</text>
<text x="340" y="416" text-anchor="middle" font-size="12" fill="#80868b">Profondeur exagérée sur le dessin : en vrai, le coin dépasse de 2 cm.</text>
</svg>